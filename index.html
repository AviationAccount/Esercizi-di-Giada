<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Giada</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="https://lh3.googleusercontent.com/d/1Bf8F0i4k99R-XgD5UqS-Uo6u7o_Lg_yA=s128">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1Bf8F0i4k99R-XgD5UqS-Uo6u7o_Lg_yA=s180">
    <meta name="msapplication-TileImage" content="https://lh3.googleusercontent.com/d/1Bf8F0i4k99R-XgD5UqS-Uo6u7o_Lg_yA=s270">

    <style>
        :root {
            --primary: #e74c3c;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #27ae60;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Titolo aggiornato */
        h1 { 
            color: var(--primary); 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            text-align: center;
            text-transform: uppercase;
        }

        /* Slider / Tab Navigation (Senza position: sticky) */
        .slider-nav {
            display: flex;
            background: #252525;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .slider-nav button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .slider-nav button.active {
            background: var(--primary);
            color: white;
        }

        /* Contenitore Esercizi */
        .day-content {
            display: none;
            width: 100%;
            max-width: 1000px;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-content.active { display: grid; }

        /* Card Esercizio */
        .card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .image-container {
            width: 100%;
            height: 220px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-info {
            padding: 15px;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-text h3 { 
            margin: 0; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            color: #bbb;
        }

        .info-text p { 
            margin: 5px 0 0; 
            color: var(--primary); 
            font-size: 1.3rem; 
            font-weight: 800; 
        }

        .done-check {
            width: 25px;
            height: 25px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .card.completed {
            opacity: 0.4;
            filter: grayscale(1);
        }
    </style>
</head>
<body>

    <h1>WORKOUT GIADA</h1>

    <div class="slider-nav">
        <button class="active" onclick="showDay('day1', this)">DAY 1</button>
        <button onclick="showDay('day2', this)">DAY 2</button>
        <button onclick="showDay('day3', this)">DAY 3</button>
    </div>
